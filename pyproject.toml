[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pasta-sim"
version = "0.1"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "setuptools>=84.0.0",
    "six>=1.17.0"
]
requires-python = ">=3.12"
authors = [
  {name = "Valerio Basile", email = "valerio.basile@unito.it"},
]
readme = "README.md"